# The pipeline runs the same `make` targets a developer runs, in the same order.
#
# It installs no language toolchain: every step is a container, so what runs here
# and what runs on a laptop are the same images with the same pinned versions.
#
# MODE=prod throughout, stated rather than left to the default: prod is the only
# mode CI or any deployed environment may use. The dev image is never built here.
#
# Every pull request and every push to master runs the gates. Only a version
# tag (v1.2.3) on a commit already on master is released (ADR 0055, 0060): the
# gates run again on the tagged commit, then the prod images for every platform
# the app runs on are pushed to GHCR, and release.env, naming each by digest, is
# attached to the tag's GitHub Release for the droplet and the compute machine.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Create the environment file
        # Every environment supplies the same variable names from .env.example,
        # only the values differ. CI is no exception.
        run: ./.github/workflows/ci-env.sh

      - run: make build-infra
      - run: make build-app MODE=prod

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        # Hermetic: infra is not up yet, and the containers run with no network.
        run: make test-unit

      - run: make start-infra
      - run: make migrate MODE=prod

      - name: Integration tests
        run: make test-integration

      - name: Check the generated API client is current
        run: |
          make gen-client
          git diff --exit-code web/src/api/schema.d.ts \
            || { echo "The API contract changed. Run 'make gen-client' and commit."; exit 1; }

      - name: Dependency and image scan
        run: make scan

      - name: Diagnostics on failure
        if: failure()
        run: make logs || true

      - name: Stop
        if: always()
        run: make stop-app MODE=prod || true; make stop-infra || true

  release:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write  # the GitHub Release that carries release.env
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and every branch, so push-app can check the tagged
          # commit is on origin/master.
          fetch-depth: 0

      - name: Create the environment file
        run: ./.github/workflows/ci-env.sh

      # Building arm64 on an amd64 runner: emulated, so slow, but the same
      # Dockerfiles and the same make target as anywhere else.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the release
        run: make push-app

      - name: Say which release this is
        run: |
          {
            echo "### Release ${GITHUB_REF_NAME}"
            echo
            echo 'Download release.env from the GitHub Release, then pull it on the'
            echo 'droplet, then on the compute machine:'
            echo "    make pull-app RELEASE=release.env"
            echo
            echo '```'
            cat release.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub Release
        # A release asset stays as long as the tag; a run artifact expires.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release.env --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
