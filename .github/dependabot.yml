# Dependabot: what it watches, and how its pull requests look.
#
# Security updates (on in the repo's settings) open a PR as soon as an advisory
# names a dependency we lock, whatever the schedule below says. Version
# updates are the weekly PRs configured here: minor and patch bumps grouped
# into one PR per ecosystem, majors one PR each.
#
# Every PR it opens runs CI's `verify` like any other: `make scan`, lint,
# typecheck and both test tiers. Dependabot never runs make; CI checks its work.
#
# `rebase-strategy: disabled`: master requires PRs to be up to date, so
# rebasing every open PR on each merge would rerun `verify` on all of them.
# Comment `@dependabot rebase` on the one you are about to merge instead.
#
# What moves only on purpose, never from a Dependabot PR: the language each
# image runs (python, node: patch bumps only) and TypeScript's major, which
# waits until openapi-typescript (`make gen-client`) supports it.
#
# Not watched, because Dependabot cannot read them: tool images pinned in the
# Makefile (Trivy, the AWS CLI) and the app's own careerpolaris-* images.
version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    # A new release waits a week before it is proposed, so one pulled or
    # compromised in its first days never reaches a PR. Security updates skip it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(no-ticket)
    rebase-strategy: disabled
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # ESLint and its plugins only work at matching majors, so they move in
      # one PR, majors included. `web` excludes them by name: Dependabot gives
      # a package to the group it calls more specific, not the first listed.
      eslint:
        patterns: [eslint, "@eslint/*", typescript-eslint, "eslint-plugin-*"]
      web:
        update-types: [minor, patch]
        exclude-patterns: [eslint, "@eslint/*", typescript-eslint, "eslint-plugin-*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(no-ticket)
    rebase-strategy: disabled
    groups:
      backend:
        update-types: [minor, patch]

  # Base images in each Dockerfile's FROM lines.
  - package-ecosystem: docker
    directories: [/backend, /web, /proxy]
    # Python 3.12 -> 3.14 counts as a minor bump here, but it is a language
    # upgrade: requires-python, uv.lock and every wheel move with it.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major, version-update:semver-minor]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(no-ticket)
    rebase-strategy: disabled
    groups:
      base-images:
        update-types: [minor, patch]

  # Infra images: Postgres with pgvector, the S3 gateway, Tailscale.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(no-ticket)
    rebase-strategy: disabled
    groups:
      infra-images:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(no-ticket)
    rebase-strategy: disabled
    groups:
      actions:
        update-types: [minor, patch]
