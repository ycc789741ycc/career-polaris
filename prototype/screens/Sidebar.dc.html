<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<aside style="width: 246px; height: 100%; min-height: 900px; box-sizing: border-box; background: #ebddc5; color: #201e1d; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; padding: 22px 22px 16px; font-family: Caprasimo, system-ui, sans-serif; font-size: 18px">
<span style="flex: 0 0 auto; display: inline-flex"><svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="26" fill="#c67139"></rect><path d="M27 73 C 27 54, 50 62, 50 46 S 63 34, 66 31" fill="none" stroke="#f5ead8" stroke-width="7" stroke-linecap="round"></path><circle cx="27" cy="73" r="7.5" fill="#f5ead8"></circle><path d="M74 13 L78 22 L87 26 L78 30 L74 39 L70 30 L61 26 L70 22 Z" fill="#ffe1d0"></path></svg></span>
CareerPolaris
</div>
<nav aria-label="Screens">
<div style="display: flex; flex-direction: column; gap: 3px; padding: 6px 12px 10px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="4">
<a href="{{item.href}}" aria-current="{{item.current}}" style="display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-radius: 999px; font-size: 14px; text-decoration: none; background: {{item.bg}}; color: {{item.fg}}; font-weight: {{item.weight}}">
<span style="font-size: 11.5px; opacity: 0.5">{{item.num}}</span>
<span style="flex-grow: 1">{{item.label}}</span>
<sc-if value="{{item.hasFlag}}" hint-placeholder-val="{{false}}">
<span style="min-width: 19px; height: 19px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #c67139; color: #f9f4ed; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{item.flag}}</span>
</sc-if>
</a>
</sc-for>
</div>
<div style="border-top: 1px solid #dcd3c4; margin: 6px 22px 0; padding-top: 14px">
<div style="font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #645c50; margin-bottom: 6px">System configuration</div>
<a href="Model.dc.html" aria-current="{{model.current}}" style="display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 999px; font-size: 14px; text-decoration: none; background: {{model.bg}}; color: {{model.fg}}; font-weight: {{model.weight}}">
<span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 999px; border: 2px solid currentColor; opacity: 0.55; flex: 0 0 auto"></span>
<span style="min-width: 0">AI &amp; model<span style="display: block; font-size: 11.5px; font-weight: 500; opacity: 0.75">claude-sonnet-5</span></span>
</a>
</div>
</nav>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["sources","strengths","roles","advisor","model"],"default":"sources"},"target":{"editor":"enum","options":["set","none"],"default":"set"},"$preview":{"width":246,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const current = this.props.current ?? 'sources';
    // No target is set until the user clicks "Target this role" (role map) or "Set as target" (own role),
    // so outside the Advisor the link opens the no-target screen. The no-target screen passes target="none".
    const advisorHref = (current === 'advisor' && this.props.target !== 'none') ? 'Gaps.dc.html' : 'AdvisorNoTarget.dc.html';
    const look = (on) => on
      ? { current: 'page', bg: '#ffe1d0', fg: '#643312', weight: 700 }
      : { current: undefined, bg: 'transparent', fg: '#201e1d', weight: 500 };
    const journey = [
      { id: 'sources', num: '01', label: 'Sources', href: 'Main.dc.html' },
      { id: 'strengths', num: '02', label: 'Strengths', href: 'Strengths.dc.html' },
      { id: 'roles', num: '03', label: 'Role map', href: 'Roles.dc.html' },
      { id: 'advisor', num: '04', label: 'Advisor', href: advisorHref }
    ];
    return {
      items: journey.map((item) => ({ ...item, hasFlag: !!item.flag, ...look(item.id === current) })),
      model: look(current === 'model')
    };
  }
}
</script>
</body>
</html>
