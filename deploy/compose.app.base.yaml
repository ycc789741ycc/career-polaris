# The application's services, as every machine runs them (ADR 0062). Never run
# on its own: each machine's deploy/<machine>/compose.app.yaml picks the
# services it runs from here with `extends`, and adds what depends on the
# machine — the project and network names, memory and CPU ceilings, published
# ports, and, on `local`, the dev images with the source mounted.
#
# What lives here is what is the same everywhere: the image, the command, the
# configuration each service reads from .env, and the hardening. Nothing here
# depends on the machine's size, and nothing here is a secret.
#
# `api`, `worker` and `crawler` are one image with three commands — that is
# what "one artifact promoted unchanged" means here.
#
# Each service is given only the configuration it needs. `env_file` is
# deliberately NOT on a shared anchor: handing every container the whole .env
# would put the master encryption key and the connector secrets inside the
# crawler and the SPA, which architecture.md section 4 forbids.
#
# Paths are relative to this file: compose resolves an extended service's
# paths against the file it came from.

# Docker's default json-file driver keeps every line a container writes,
# forever, which is how a quiet host eventually runs out of disk. Rotate it.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-hardened: &hardened
  <<: *logging
  security_opt:
    - no-new-privileges:true
  # These images are built locally by `make build-app` or pulled by digest by
  # `make pull-app`, never pulled by name. Without this, a missing tag sends
  # compose to Docker Hub — at best a confusing error, at worst a stranger's
  # public image that happens to share the name.
  pull_policy: never

x-backend: &backend
  <<: *hardened
  build:
    context: ../backend
    target: prod
  image: careerpolaris-backend:prod
  # These processes only ever write to the caches a machine mounts.
  read_only: true
  tmpfs:
    # Nothing here writes to /tmp itself; the cap is for libraries that do.
    - /tmp:size=128m

x-long-running: &long-running
  restart: unless-stopped

services:
  # Verifies tokens, serves HTTP, starts connector OAuth. Holds the master key.
  api:
    <<: [*backend, *long-running]
    pids_limit: 256
    env_file: ../.env
    command:
      - uvicorn
      - api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      # The client's own address from X-Forwarded-For, believed only when the
      # proxy sent it (ADR 0054): set FORWARDED_ALLOW_IPS to the network's
      # subnet where the proxy runs. The default believes no one.
      - --proxy-headers
      - --forwarded-allow-ips
      - ${FORWARDED_ALLOW_IPS:-127.0.0.1}

  # Runs AI jobs and connector syncs. Holds the master key and connector tokens.
  worker:
    <<: [*backend, *long-running]
    pids_limit: 512
    env_file: ../.env
    command: ["python", "-m", "worker.main"]

  # Parses hostile HTML from the internet, so it holds no secrets at all — not
  # the master encryption key, not a connector token, not even app_rw's
  # connection string. Its environment is listed explicitly rather than taken
  # from .env, and require_for(Unit.CRAWLER) asserts at startup that this is
  # genuinely all it needs.
  crawler:
    <<: [*backend, *long-running]
    pids_limit: 256
    command: ["python", "-m", "crawler.main"]
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      SERVICE_NAME: ${SERVICE_NAME:-careerpolaris}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CRAWLER_DATABASE_URL: ${CRAWLER_DATABASE_URL:?CRAWLER_DATABASE_URL is required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      CRAWL_USER_AGENT: ${CRAWL_USER_AGENT:-CareerPolarisBot/1.0}
      CRAWL_HTTP_TIMEOUT_SECONDS: ${CRAWL_HTTP_TIMEOUT_SECONDS:-30}
      CRAWL_RATE_LIMIT_PER_HOST_PER_SECOND: ${CRAWL_RATE_LIMIT_PER_HOST_PER_SECOND:-1}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      PRESENCE_HEARTBEAT_SECONDS: ${PRESENCE_HEARTBEAT_SECONDS:-10}

  # A one-off: every pending migration to completion, then exit. `make migrate`
  # runs it as start-app's first step, on every machine, so the app never
  # serves on a half-migrated database. Not long-running, and behind a profile
  # so `up` never starts it.
  migrate:
    <<: *backend
    pids_limit: 256
    profiles: ["migrate"]
    env_file: ../.env
    command: ["python", "-m", "cli.migrate"]

  # Static bundle plus a config.js written at start. Everything it receives
  # reaches the browser, so it receives nothing else.
  web:
    <<: [*hardened, *long-running]
    pids_limit: 256
    build:
      context: ../web
      target: prod
    image: careerpolaris-web:prod
    environment:
      WEB_API_BASE_URL: ${WEB_API_BASE_URL:?WEB_API_BASE_URL is required}
      WEB_PRIVACY_CONTACT_EMAIL: ${WEB_PRIVACY_CONTACT_EMAIL:?WEB_PRIVACY_CONTACT_EMAIL is required}

  # The edge (ADR 0053): TLS for SITE_HOSTNAME, one origin for the SPA and
  # the api, a cap on request bodies, timeouts for slow clients, and limits
  # per client address. Only the droplet runs it.
  proxy:
    <<: [*hardened, *long-running]
    pids_limit: 128
    build:
      context: ../proxy
      target: prod
    image: careerpolaris-proxy:prod
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    # Ports 80 and 443 without root or a capability.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      # Required where this runs; start-proxy refuses to start without it.
      SITE_HOSTNAME: ${SITE_HOSTNAME:-}
      EDGE_MAX_BODY_SIZE: ${EDGE_MAX_BODY_SIZE:-11MB}
      EDGE_AUTH_REQUESTS_PER_MINUTE: ${EDGE_AUTH_REQUESTS_PER_MINUTE:-10}
      EDGE_REQUESTS_PER_MINUTE: ${EDGE_REQUESTS_PER_MINUTE:-300}
      EDGE_READ_HEADER_TIMEOUT: ${EDGE_READ_HEADER_TIMEOUT:-10s}
      EDGE_READ_BODY_TIMEOUT: ${EDGE_READ_BODY_TIMEOUT:-120s}
      EDGE_IDLE_TIMEOUT: ${EDGE_IDLE_TIMEOUT:-2m}
