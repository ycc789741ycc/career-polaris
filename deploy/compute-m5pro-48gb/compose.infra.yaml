# The compute machine's infra (ADR 0051, 0062): only the tunnel, which dials out
# to the droplet. Postgres runs there and files live in Spaces. Names as before
# ADR 0062, so `tunnelstate` — this machine's Tailscale identity — carries over.

name: careerpolaris-infra

networks:
  default:
    name: careerpolaris_net
    external: true

services:
  tunnel:
    extends: {file: ../compose.infra.base.yaml, service: tunnel}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5

volumes:
  tunnelstate:
